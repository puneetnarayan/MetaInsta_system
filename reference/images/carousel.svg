<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect width="1080" height="1080" fill="#f7f4ef"/><text x="70" y="100" font-family="Arial" font-size="34" font-weight="700" fill="#14294a">CAROUSEL · 4 CARDS</text><g font-family="Arial"><rect x="60" y="180" width="225" height="720" rx="22" fill="#e5edf5"/><rect x="305" y="180" width="225" height="720" rx="22" fill="#f8e9ed"/><rect x="550" y="180" width="225" height="720" rx="22" fill="#e5f1f0"/><rect x="795" y="180" width="225" height="720" rx="22" fill="#dfe8f1"/><text x="85" y="245" font-size="25" font-weight="700" fill="#14294a">1</text><text x="85" y="320" font-size="31" font-weight="700" fill="#14294a">Stuck or</text><text x="85" y="360" font-size="31" font-weight="700" fill="#14294a">silent?</text><text x="85" y="430" font-size="20" fill="#334155">You have good ideas,</text><text x="85" y="460" font-size="20" fill="#334155">but hesitate to speak.</text><text x="330" y="245" font-size="25" font-weight="700" fill="#14294a">2</text><text x="330" y="320" font-size="31" font-weight="700" fill="#14294a">Recognise</text><text x="330" y="360" font-size="31" font-weight="700" fill="#14294a">the moment</text><text x="330" y="430" font-size="20" fill="#334155">You search for words</text><text x="330" y="460" font-size="20" fill="#334155">while the meeting moves on.</text><text x="575" y="245" font-size="25" font-weight="700" fill="#14294a">3</text><text x="575" y="320" font-size="31" font-weight="700" fill="#14294a">Practise</text><text x="575" y="360" font-size="31" font-weight="700" fill="#14294a">the skill</text><text x="575" y="430" font-size="20" fill="#334155">Learn practical ways to</text><text x="575" y="460" font-size="20" fill="#334155">express ideas clearly.</text><text x="820" y="245" font-size="25" font-weight="700" fill="#14294a">4</text><text x="820" y="320" font-size="31" font-weight="700" fill="#14294a">Take the</text><text x="820" y="360" font-size="31" font-weight="700" fill="#14294a">next step</text><text x="820" y="430" font-size="20" fill="#334155">Speak in Meetings</text><text x="820" y="460" font-size="20" fill="#334155">Workshop · ₹997</text></g></svg>